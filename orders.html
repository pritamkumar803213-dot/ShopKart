<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f3f3f3;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.order{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.order h3{
margin-bottom:10px;
color:#131921;
}

.order p{
margin:5px 0;
}

.product{
padding:8px;
border-bottom:1px solid #eee;
}

.total{
font-size:22px;
font-weight:bold;
color:#b12704;
margin-top:10px;
}

.home-btn{
width:100%;
padding:15px;
background:#ff9900;
color:white;
border:none;
cursor:pointer;
font-size:18px;
border-radius:5px;
margin-top:20px;
}

</style>

</head>
<body>

<h1>📦 My Orders</h1>

<div class="container" id="ordersContainer">

</div>

<button
class="home-btn"
onclick="window.location.href='index.html'">
Back To Home
</button>

<script>

let orders =
JSON.parse(localStorage.getItem("orders"))
|| [];

let container =
document.getElementById("ordersContainer");

if(orders.length===0){

container.innerHTML =
"<h2>No Orders Found</h2>";

}else{

orders.reverse().forEach(order=>{

let productsHTML = "";

order.items.forEach(item=>{

productsHTML += `
<div class="product">
${item.name} - ₹${item.price}
</div>
`;

});

container.innerHTML += `

<div class="order">

<h3>Order Date:
${order.date}</h3>

<p><b>Name:</b>
${order.name}</p>

<p><b>Mobile:</b>
${order.mobile}</p>

<p><b>Address:</b>
${order.address}</p>

<h4>Products:</h4>

${productsHTML}

<div class="total">
Total: ₹${order.total}
</div>

</div>

`;

});

}

</script>

</body>
</html>
